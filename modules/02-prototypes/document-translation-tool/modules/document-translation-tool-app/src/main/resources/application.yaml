server:
  port: 8080

spring:
  application:
    name: document-translation-tool
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  config:
    import: optional:classpath:spring-ai.yaml

logging:
  level:
    tungnn.tutor.java: ${LOG_LEVEL_DOCTRANS:INFO}

doctrans:
  storage:
    baseDir: storage/app/doctrans
  dir:
    job: job
    memory: text-translation-memory
  worker-threads: 2
  translator:
    provider: ${DOCTRANS_TRANSLATOR_PROVIDER:gemini}   # gemini | huggingface
    huggingface:
      base-url: https://router.huggingface.co/v1
      token: ${HF_TOKEN:}
      model: ${HF_MODEL:}                                # e.g. a chat model id from /v1/models
      temperature: 0
      timeout-seconds: 120
