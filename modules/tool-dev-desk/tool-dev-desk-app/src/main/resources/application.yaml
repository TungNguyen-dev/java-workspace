server:
  port: ${HUB_PORT:8080}
  address: ${HUB_BIND_ADDRESS:127.0.0.1}
  servlet:
    session:
      tracking-modes: cookie
spring:
  application:
    name: tool-dev-desk-app
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
hub:
  plugins-dir: ${HUB_PLUGINS_DIR:plugins}
  data-dir: ${HUB_DATA_DIR:data}
  watch: ${HUB_WATCH:true}
  security:
    username: ${HUB_USERNAME:admin}
    password: ${HUB_PASSWORD:}
